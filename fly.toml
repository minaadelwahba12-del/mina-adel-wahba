# غيّر اسم التطبيق لاسم مميز بالإنجليزي (بيبقى جزء من الرابط)
app = "press-accounting"
primary_region = "fra"

[build]

[env]
  PRESS_DB = "/data/press.db"
  PRESS_HTTPS = "1"
  PRESS_PROXY = "1"
  HOST = "0.0.0.0"
  PORT = "8000"

[mounts]
  source = "press_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
